// ---------- MASTER ADMIN: storage clean-up (auto-delete old photos and logs) ----------
const RETS=[[0,"Never delete"],[7,"Delete after 7 days"],[15,"Delete after 15 days"],[21,"Delete after 21 days"],[30,"Delete after one month"]];
const retO=()=>RETS.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("");
const retT=n=>(RETS.find(x=>x[0]==n)||[0,"Never delete"])[1].toLowerCase();
async function retv(){if(!SM())return;stopGps();camStop();
$("m").innerHTML=`<a href="#" onclick="show(3);return false">&larr; Back</a><h4>Storage clean-up <small>(master admin only)</small></h4>
<p class=sm>Old photos, leave memos / medical certificates and logs take up space on the server (Google Drive / Google Sheet). Choose how long to keep them; older items are then deleted automatically every night (about 3 AM). Attendance records, staff, offices and transfers are never deleted - only the photo of an old record goes, and the record then shows "photo removed".</p>
<label>Attendance photos, leave memos and medical certificates (Google Drive)</label><select id=rph>${retO()}</select>
<label>Logs (Activity log + Security log of blocked attempts)</label><select id=rlg>${retO()}</select>
<p class=msg id=rme></p><div class=row><button onclick=retSave()>Save</button><button onclick=retRun() style="background:#344054">Delete old items now</button></div><p class=sm id=rmi>Loading current setting...</p>`;
if(SV!==null&&SV<8.1)$("rme").textContent="The server is older than v8.1 - paste the new Code.gs and deploy a New version first.";
try{const j=await call({k:"rget"});if(!$("rph"))return;if(j.err)return j.err=="auth"?kick():$("rme").textContent=j.err=="Unknown request"?"The server is older than v8.1 - paste the new Code.gs and deploy a New version first.":j.err;
$("rph").value=j.ph;$("rlg").value=j.lg;
$("rmi").innerHTML=(j.ph||j.lg?"Automatic daily clean-up: "+(j.tr?"<b>ON</b>":"<b>timer missing</b> - tap Save again"):"Automatic clean-up is OFF (never delete).")+(j.last?"<br>Last clean-up: "+esc(j.last):"")}
catch(x){if($("rmi"))$("rmi").textContent="Needs internet connection"}}
async function retSave(){const e=$("rme"),ph=Number($("rph").value),lg=Number($("rlg").value);e.textContent="";
if((ph||lg)&&!confirm("Photos: "+retT(ph)+"\nLogs: "+retT(lg)+"\n\nOlder photos, leave memos / medical certificates and log entries will be deleted from the server every night. Deleted photos cannot be brought back (they stay in Google Drive Trash for up to 30 days at best).\n\nSave?"))return;
try{const j=await call({k:"rset",ph,lg});if(j.err)return j.err=="auth"?kick():e.textContent=j.err;
alert("Saved.\nPhotos: "+retT(j.ph)+"\nLogs: "+retT(j.lg)+(j.warn?"\n\n"+j.warn:""));retv()}catch(x){e.textContent="Needs internet connection"}}
async function retRun(){const e=$("rme"),ph=Number($("rph").value),lg=Number($("rlg").value);e.textContent="";
if(!ph&&!lg)return e.textContent="Both options are \"Never delete\" - choose days and tap Save first";
if(!confirm("Delete NOW all photos, leave memos and medical certificates older than the saved setting and all old log entries?\n(Tap Save first if you just changed the options.)"))return;
$("rmi").textContent="Deleting... this can take a minute. Please wait.";
